<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRGHOST - AI DEVELOPER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030805;
            --panel-bg: rgba(0, 255, 102, 0.05);
            --neon-green: #00ff66;
            --neon-glow: 0 0 20px rgba(0, 255, 102, 0.4);
            --border-neon: 1px solid rgba(0, 255, 102, 0.3);
            --text-color: #e0f8ec;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 255, 102, 0.15) 0%, transparent 50%),
                linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .crown {
            font-size: 28px;
            color: var(--neon-green);
            text-shadow: var(--neon-glow);
            animation: pulse 2s infinite;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
            margin-top: 5px;
        }

        .subtitle {
            font-size: 12px;
            letter-spacing: 4px;
            color: var(--neon-green);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Profile Card */
        .card {
            background: var(--panel-bg);
            border: var(--border-neon);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.05);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 10px; height: 10px;
            border-top: 2px solid var(--neon-green);
            border-left: 2px solid var(--neon-green);
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0; width: 10px; height: 10px;
            border-bottom: 2px solid var(--neon-green);
            border-right: 2px solid var(--neon-green);
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-box {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--neon-green);
            box-shadow: var(--neon-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #001a08;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--neon-green);
            font-size: 20px;
        }

        .user-details h3 {
            font-size: 18px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
        }

        .user-details p {
            font-size: 13px;
            color: #8fa89b;
            margin-top: 3px;
        }

        /* AI Models Grid */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--neon-green);
            margin-bottom: 12px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .ai-item {
            background: rgba(0, 255, 102, 0.03);
            border: 1px solid rgba(0, 255, 102, 0.2);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            transition: all 0.3s ease;
        }

        .ai-item:hover {
            border-color: var(--neon-green);
            box-shadow: var(--neon-glow);
            transform: translateY(-2px);
        }

        /* Action Buttons */
        .btn-cyber {
            width: 100%;
            background: linear-gradient(135deg, #003311, #001a08);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 14px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: var(--neon-glow);
            transition: all 0.3s;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .btn-cyber:active {
            background: var(--neon-green);
            color: #000;
        }

        /* Footer / Credits */
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #5c7a6b;
            border-top: 1px dashed rgba(0, 255, 102, 0.2);
            padding-top: 15px;
        }

        footer span {
            color: var(--neon-green);
            font-weight: 700;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 25px var(--neon-green); }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="crown">👑</div>
            <h1>MRGHOST</h1>
            <div class="subtitle">The AI Developer</div>
        </header>

        <!-- User Profile Card -->
        <div class="card">
            <div class="profile-info">
                <div class="avatar-box" id="user-avatar">MG</div>
                <div class="user-details">
                    <h3 id="username">Loading...</h3>
                    <p id="userid">ID: --</p>
                </div>
            </div>
        </div>

        <!-- AI Integration Hub -->
        <div class="section-title">⚡ NEURAL AI CORE</div>
        <div class="ai-grid">
            <div class="ai-item">ChatGPT 🤖</div>
            <div class="ai-item">Gemini 💎</div>
            <div class="ai-item">Claude 🧠</div>
            <div class="ai-item">Grok ⚡</div>
        </div>

        <!-- Interactive Trigger -->
        <button class="btn-cyber" onclick="triggerAction()">⚡ RUN SYSTEM DIAGNOSTIC</button>
        <button class="btn-cyber" style="background: rgba(0,255,102,0.1); color:#fff;" onclick="sendDataBack()">🚀 SYNC WITH BOT</button>

        <footer>
            Code the Future With MrGhost ♡<br>
            Cre: <span>@mrghostdev1</span> | TikTok: <span>@nguyenduchaupro</span>
        </footer>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById("username").innerText = user.first_name + (user.last_name ? " " + user.last_name : "");
            document.getElementById("userid").innerText = "ID: " + user.id;
            let initials = user.first_name.substring(0, 2).toUpperCase();
            document.getElementById("user-avatar").innerText = initials;
        } else {
            document.getElementById("username").innerText = "MrGhost Operator";
            document.getElementById("userid").innerText = "ID: 9160154439";
        }

        function triggerAction() {
            tg.HapticFeedback.notificationOccurred('success');
            alert("🔥 Hệ thống AI của MrGhost hoạt động hoàn hảo! Đang tối ưu hóa Neural Core...");
        }

        function sendDataBack() {
            tg.HapticFeedback.impactOccurred('heavy');
            let payload = { status: "active", developer: "mrghostdev1", timestamp: Date.now() };
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
